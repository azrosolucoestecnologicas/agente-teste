name: Testar e publicar no Render

# Gatilhos: o que faz este processo começar
on:
  push:
    branches: [main] # todo commit na branch principal: testa e publica
  pull_request: # todo pull request: só testa (o portão roda antes do merge)
  workflow_dispatch: # o botão "Run workflow" na aba Actions

# Um deploy por vez: dois pushes seguidos não gravam a coleção 'teste' ao mesmo tempo
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Job 1: o portão. Se falhar, nenhum outro job começa.
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar o front-end
        working-directory: frontend
        run: npm ci && npm run build

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do teste
        run: pip install -r requirements.txt pytest

      - name: Rodar o portão (T1 a T17)
        run: python testes.py

      - name: Testar a API (T16)
        run: pytest testes_api.py -v

  # Job 2: o portão da busca (Parte 2). Monta o índice novo na coleção 'teste' do Supabase
  # e faz as perguntas de teste. Se falhar, a coleção 'producao' (o que está no ar) nem é tocada.
  avaliar:
    needs: testar
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências da indexação (com a leitura de PDF)
        run: pip install fastembed supabase pyyaml pymupdf4llm

      - name: Montar o índice na coleção teste
        run: python indexar.py

      - name: Rodar as perguntas de teste
        run: python avaliar.py

  # Job 3: publicação. Só roda num commit da main e se o "avaliar" passou.
  publicar:
    needs: avaliar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promover o índice testado para a produção
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pip install supabase pyyaml
          python indexar.py --promover

      - name: Pedir o deploy ao Render (Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERRO: cadastre o secret RENDER_DEPLOY_HOOK_URL (Render: serviço > Settings > Deploy Hook)."
            exit 1
          fi
          # ref= pede ao Render exatamente o commit que passou no portão
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
          echo "Deploy do commit ${GITHUB_SHA} pedido ao Render."

  # Job 4: confere o site no ar. Espera o Render responder com a versão deste commit.
  verificar:
    needs: publicar
    runs-on: ubuntu-latest
    env:
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Esperar a versão nova no ar
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "ERRO: cadastre a variável RENDER_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # A cada 20 segundos, por até 15 minutos (o primeiro build no Render é o mais lento)
          for tentativa in $(seq 1 45); do
            resposta=$(curl -s --max-time 15 "${RENDER_URL%/}/api/saude" || true)
            echo "[$tentativa] $resposta"
            if echo "$resposta" | grep -q '"status":"ok"' && echo "$resposta" | grep -q "\"versao\":\"${GITHUB_SHA}\""; then
              echo "No ar: ${RENDER_URL} com o commit ${GITHUB_SHA}."
              exit 0
            fi
            sleep 20
          done
          echo "ERRO: a versão ${GITHUB_SHA} não apareceu em ${RENDER_URL}/api/saude."
          echo "Veja o log do deploy no painel do Render (Events e Logs)."
          exit 1
